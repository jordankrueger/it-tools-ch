server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA fallback: any request under /<prefix>/ falls back to /<prefix>/index.html
  location ~ ^/([^/]+)/ {
    try_files $uri $uri/ /$1/index.html;
  }

  # Cache hashed assets for 1 year (Vite emits content-hashed filenames in assets/)
  location ~ ^/[^/]+/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache index.html — it holds references to the hashed asset filenames
  location ~ ^/[^/]+/index\.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}
